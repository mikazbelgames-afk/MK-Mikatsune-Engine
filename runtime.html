<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MK Mikatsune Runtime</title>
  <style>
    html,body{margin:0;min-width:100%;min-height:100%;background:transparent!important}
    body{overflow:auto}
    .runtime-shell{width:1080px;height:1080px;display:grid;place-items:center}
    #stage{display:block;width:1080px;height:1080px;background:transparent}
    body.obs{overflow:hidden;width:100vw;height:100vh}
    body.obs .runtime-shell{width:100vw;height:100vh}
    body.obs #stage{width:100%;height:100%;object-fit:contain}
  </style>
</head>
<body>
  <div class="runtime-shell">
    <canvas id="stage" width="1080" height="1080" aria-label="MK Mikatsune Runtime"></canvas>
  </div>
  <script>
    if(new URL(location.href).searchParams.get('mode')==='obs') document.body.classList.add('obs');
  </script>
  <script type="module" src="./src/runtime.js"></script>
</body>
</html>
